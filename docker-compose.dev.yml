# Development overlay: `docker compose -f docker-compose.yml -f docker-compose.dev.yml up`
# (that is what `make dev` runs).
#
# Adds source bind mounts and reload so a code change does not mean a rebuild,
# and exposes the backing services on localhost so you can psql/redis-cli into
# them. Never use this file in a deployment — it opens ports the reference
# deployment deliberately keeps internal.

name: sightglass

x-dev-source: &dev-source
  - ./core:/app/core
  - ./api:/app/api
  - ./cli:/app/cli
  - ./reporting:/app/reporting
  - ./mcp:/app/mcp
  - ./detections:/app/detections
  - ./sandbox:/app/sandbox
  - ./tests:/app/tests

services:
  postgres:
    ports:
      - "${SIGHTGLASS_POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "${SIGHTGLASS_REDIS_PORT:-6379}:6379"

  minio:
    ports:
      - "${SIGHTGLASS_MINIO_PORT:-9000}:9000"
      - "${SIGHTGLASS_MINIO_CONSOLE_PORT:-9001}:9001"

  api:
    environment:
      SIGHTGLASS_ENVIRONMENT: development
      SIGHTGLASS_LOG_JSON: "false"
      SIGHTGLASS_LOG_LEVEL: DEBUG
    command:
      - uvicorn
      - api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/api
      - --reload-dir
      - /app/core
    volumes: *dev-source

  worker:
    environment:
      SIGHTGLASS_ENVIRONMENT: development
      SIGHTGLASS_LOG_JSON: "false"
      SIGHTGLASS_LOG_LEVEL: DEBUG
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SIGHTGLASS_RUN_ROOT_HOST:-/var/lib/sightglass/runs}:/var/lib/sightglass/runs
      - ./core:/app/core
      - ./api:/app/api
      - ./cli:/app/cli
      - ./reporting:/app/reporting
      - ./mcp:/app/mcp
      - ./detections:/app/detections
      - ./sandbox:/app/sandbox
      - ./tests:/app/tests

  worker-heavy:
    environment:
      SIGHTGLASS_LOG_JSON: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SIGHTGLASS_RUN_ROOT_HOST:-/var/lib/sightglass/runs}:/var/lib/sightglass/runs
      - ./core:/app/core
      - ./sandbox:/app/sandbox

  beat:
    environment:
      SIGHTGLASS_LOG_JSON: "false"
    volumes: *dev-source

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: dev
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    command: ["npm", "run", "dev"]
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
