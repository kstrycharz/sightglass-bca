# Reference deployment. `docker-compose.dev.yml` layers development conveniences
# (source bind mounts, reload, exposed ports) on top of this.
#
# A note on the two run-root variables, because this is the one thing here that
# reliably costs people an afternoon.
#
# The worker spawns analyzer containers as *siblings* through the host's Docker
# socket. Bind-mount paths in those requests are resolved by the daemon on the
# HOST, not inside the worker. So there are two paths for one directory:
#
#   SIGHTGLASS_RUN_ROOT_HOST — where it lives on the host (what the daemon sees)
#   SIGHTGLASS_RUN_ROOT      — where the worker sees it (fixed, inside the image)
#
# The driver translates between them. A named volume cannot work here because
# it has no host path the daemon can be given, and mounting both at an
# identical path is impossible on Windows, where a host path is `C:\...`.
#
# Get this wrong and analyzers get empty input directories with no error at all.

name: sightglass

x-backend-env: &backend-env
  SIGHTGLASS_DATABASE_URL: postgresql+psycopg://sightglass:sightglass@postgres:5432/sightglass
  SIGHTGLASS_REDIS_URL: redis://redis:6379/0
  SIGHTGLASS_S3_ENDPOINT_URL: http://minio:9000
  SIGHTGLASS_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-sightglass}
  SIGHTGLASS_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-sightglass}
  SIGHTGLASS_RUN_ROOT: /var/lib/sightglass/runs
  SIGHTGLASS_RUN_ROOT_HOST: ${SIGHTGLASS_RUN_ROOT_HOST:-/var/lib/sightglass/runs}
  SIGHTGLASS_REPO_ROOT: /app
  SIGHTGLASS_LOG_LEVEL: ${SIGHTGLASS_LOG_LEVEL:-INFO}
  SIGHTGLASS_EGRESS_POLICY: ${SIGHTGLASS_EGRESS_POLICY:-deny}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sightglass
      POSTGRES_PASSWORD: sightglass
      POSTGRES_DB: sightglass
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sightglass -d sightglass"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sightglass}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sightglass}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: create the artifact bucket, then exit.
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sightglass}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sightglass}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/sightglass-artifacts &&
      mc anonymous set none local/sightglass-artifacts &&
      echo 'bucket ready'
      "
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    environment: *backend-env
    command:
      - uvicorn
      - api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "${SIGHTGLASS_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Fast lanes: string scanning, unpacking, correlation. Concurrency is high
  # because these tasks are short and mostly I/O bound.
  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    environment: *backend-env
    command:
      - celery
      - -A
      - core.orchestrator.celery_app:celery_app
      - worker
      - --loglevel=info
      - --concurrency=4
      - --queues=control,unpack,static,llm
    volumes:
      # Root-equivalent on the host. Deliberate and documented: the worker is
      # the only component that spawns containers. Analyzers never see it.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SIGHTGLASS_RUN_ROOT_HOST:-/var/lib/sightglass/runs}:/var/lib/sightglass/runs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Slow lane. Separate service so a wedged Ghidra job cannot starve the fast
  # scanners (§4); concurrency 1 because each job wants several GB.
  worker-heavy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    environment: *backend-env
    command:
      - celery
      - -A
      - core.orchestrator.celery_app:celery_app
      - worker
      - --loglevel=info
      - --concurrency=1
      - --queues=ghidra,dynamic
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SIGHTGLASS_RUN_ROOT_HOST:-/var/lib/sightglass/runs}:/var/lib/sightglass/runs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    environment: *backend-env
    command:
      - celery
      - -A
      - core.orchestrator.celery_app:celery_app
      - beat
      - --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${SIGHTGLASS_PUBLIC_API_URL:-http://localhost:8000}
      SIGHTGLASS_API_URL: http://api:8000
    ports:
      - "${SIGHTGLASS_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
