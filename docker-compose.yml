# Reference deployment. `docker-compose.dev.yml` layers development conveniences
# (source bind mounts, reload, exposed ports) on top of this.
#
# A note on the two run-root variables, because this is the one thing here that
# reliably costs people an afternoon.
#
# The worker spawns analyzer containers as *siblings* through the host's Docker
# socket. Bind-mount paths in those requests are resolved by the daemon on the
# HOST, not inside the worker. So there are two paths for one directory:
#
#   SIGHTGLASS_RUN_ROOT_HOST — where it lives on the host (what the daemon sees)
#   SIGHTGLASS_RUN_ROOT      — where the worker sees it (fixed, inside the image)
#
# The driver translates between them. A named volume cannot work here because
# it has no host path the daemon can be given, and mounting both at an
# identical path is impossible on Windows, where a host path is `C:\...`.
#
# Get this wrong and analyzers get empty input directories with no error at all.

name: sightglass

# Docker's default json-file driver never rotates, so a stack left running for a
# week fills the disk with logs of its own healthchecks. Every long-lived
# service anchors this.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-backend-env: &backend-env
  SIGHTGLASS_DATABASE_URL: postgresql+psycopg://sightglass:sightglass@postgres:5432/sightglass
  SIGHTGLASS_REDIS_URL: redis://redis:6379/0
  SIGHTGLASS_S3_ENDPOINT_URL: http://minio:9000
  SIGHTGLASS_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-sightglass}
  SIGHTGLASS_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-sightglass}
  SIGHTGLASS_RUN_ROOT: /var/lib/sightglass/runs
  SIGHTGLASS_RUN_ROOT_HOST: ${SIGHTGLASS_RUN_ROOT_HOST:-/var/lib/sightglass/runs}
  SIGHTGLASS_REPO_ROOT: /app
  SIGHTGLASS_ENVIRONMENT: ${SIGHTGLASS_ENVIRONMENT:-production}
  SIGHTGLASS_LOG_LEVEL: ${SIGHTGLASS_LOG_LEVEL:-INFO}
  SIGHTGLASS_EGRESS_POLICY: ${SIGHTGLASS_EGRESS_POLICY:-deny}
  # The API demands a token by default. On first start with no tokens the
  # dashboard's setup wizard (opened automatically at http://localhost:3000)
  # mints the first admin one; POST /api/setup/bootstrap does the same for a
  # headless operator.
  SIGHTGLASS_AUTH_REQUIRED: ${SIGHTGLASS_AUTH_REQUIRED:-true}
  # CPU quota per analyzer container. The static analyzer parallelises
  # across it; see Settings.analyzer_cpus for the measurements.
  SIGHTGLASS_ANALYZER_CPUS: ${SIGHTGLASS_ANALYZER_CPUS:-4}
  # Memory ceiling per analyzer container. A 213 MB installer unpacks to
  # ~69 000 files, which is the shape that pushes against this.
  SIGHTGLASS_ANALYZER_MEMORY_GB: ${SIGHTGLASS_ANALYZER_MEMORY_GB:-8}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sightglass
      POSTGRES_PASSWORD: sightglass
      POSTGRES_DB: sightglass
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sightglass -d sightglass"]
      interval: 5s
      timeout: 3s
      retries: 20
    <<: *logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    <<: *logging
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sightglass}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sightglass}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    <<: *logging
    restart: unless-stopped

  # One-shot: create the artifact bucket, then exit.
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sightglass}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sightglass}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/sightglass-artifacts &&
      mc anonymous set none local/sightglass-artifacts &&
      echo 'bucket ready'
      "
    restart: "no"

  # --- analyzer images -------------------------------------------------------
  #
  # These three build an image and exit. They are not services in any useful
  # sense; they are here so that ONE `docker compose up` builds everything the
  # stack needs, including the images the worker spawns as siblings through the
  # Docker socket rather than the ones Compose runs itself.
  #
  # It works because Compose builds every image in the project before it starts
  # any container. By the time the worker is up, the analyzer tags are in the
  # daemon. The `service_completed_successfully` edges on the worker exist for
  # the narrower case of `docker compose up -d worker`, which would otherwise
  # start a worker with nothing to spawn.
  #
  # Without this, a fresh clone came up entirely healthy and then failed its
  # first scan with START_FAILED. `sightglass/*:dev` are local-only tags, so the
  # daemon's implicit pull goes to Docker Hub and finds nothing there. The
  # failure surfaced at scan time, not at boot, which is the worst place for it.
  #
  # `make images` and CI build these same services, so the build context and
  # dockerfile for each analyzer are defined here and nowhere else.
  #
  # The tag follows SIGHTGLASS_ANALYZER_TAG, the same variable
  # core/sandbox/images.py resolves at scan time, so the image this builds and
  # the image the worker goes looking for cannot disagree.
  #
  # `:-` covers unset and empty, which is where analyzer_tag() also lands. It
  # cannot strip, so a whitespace-only tag exported into a bare
  # `docker compose up` builds `sightglass/static:   ` while a scan looks for
  # `:dev`. Going through `make images` normalises it; there is no way to do it
  # in Compose interpolation.
  #
  # `pull_policy: build` is not optional. `sightglass/static` parses as a Docker
  # Hub reference (namespace/repo), and Compose's default policy is to pull an
  # image it does not find locally — which on a fresh machine means Docker Hub,
  # no such repository, and "pull access denied for sightglass/static". These
  # images exist only where they are built, so Compose must never look for them
  # anywhere else. The backend and web services avoid this by having no `image:`
  # at all, which leaves them with unresolvable project-scoped names.
  analyzer-hello:
    build:
      context: sandbox/images/hello
    image: sightglass/hello:${SIGHTGLASS_ANALYZER_TAG:-dev}
    pull_policy: build
    # The image's own ENTRYPOINT is the analyzer. Nothing should analyze
    # anything here — this container exists only to make the build happen.
    entrypoint: ["/bin/true"]
    restart: "no"

  analyzer-static:
    build:
      context: .
      dockerfile: sandbox/images/static/Dockerfile
    image: sightglass/static:${SIGHTGLASS_ANALYZER_TAG:-dev}
    pull_policy: build
    entrypoint: ["/bin/true"]
    restart: "no"

  analyzer-unpack:
    build:
      context: .
      dockerfile: sandbox/images/unpack/Dockerfile
    image: sightglass/unpack:${SIGHTGLASS_ANALYZER_TAG:-dev}
    pull_policy: build
    entrypoint: ["/bin/true"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    environment: *backend-env
    command:
      - uvicorn
      - api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "${SIGHTGLASS_API_PORT:-8000}:8000"
    volumes:
      # Runtime state that must outlive a rebuild: the live LLM config the
      # setup wizard writes, and the provider key store. Everything under /app
      # is baked into the image, so without this every `docker compose build`
      # would silently discard whatever model the operator configured.
      - backend-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    <<: *logging
    restart: unless-stopped

  # Fast lanes: string scanning, unpacking, correlation. Concurrency is high
  # because these tasks are short and mostly I/O bound.
  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    environment: *backend-env
    command:
      - celery
      - -A
      - core.orchestrator.celery_app:celery_app
      - worker
      - --loglevel=info
      - --concurrency=4
      - --queues=control,unpack,static,llm
    volumes:
      # Root-equivalent on the host. Deliberate and documented: the worker is
      # the only component that spawns containers. Analyzers never see it.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SIGHTGLASS_RUN_ROOT_HOST:-/var/lib/sightglass/runs}:/var/lib/sightglass/runs
      # Shared with the API: the worker is what actually calls the model, so it
      # must read the same config and keys the wizard wrote.
      - backend-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # Not for ordering — Compose has already built these by the time any
      # container starts. This is so `docker compose up -d worker` drags the
      # analyzer builds in with it instead of starting a worker that has
      # nothing to spawn.
      analyzer-hello:
        condition: service_completed_successfully
      analyzer-static:
        condition: service_completed_successfully
      analyzer-unpack:
        condition: service_completed_successfully
      # Only the API migrates (api/main.py's lifespan calls upgrade_schema).
      # Uvicorn does not serve until that has finished, so a passing /healthz
      # is the signal that the schema exists. Without this edge a worker can be
      # running against a database that has no tables yet, and the first thing
      # it touches is a 500 rather than a wait.
      api:
        condition: service_healthy
    healthcheck:
      # Pings this container's own Celery node, so a worker that is up but
      # wedged fails its check instead of being covered by the other lane. See
      # core/orchestrator/health.py for why this is not a shell one-liner.
      test: ["CMD", "python", "-m", "core.orchestrator.health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    <<: *logging
    restart: unless-stopped

  # Slow lane. Separate service so a wedged Ghidra job cannot starve the fast
  # scanners (§4); concurrency 1 because each job wants several GB.
  worker-heavy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    environment: *backend-env
    command:
      - celery
      - -A
      - core.orchestrator.celery_app:celery_app
      - worker
      - --loglevel=info
      - --concurrency=1
      - --queues=ghidra,dynamic
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SIGHTGLASS_RUN_ROOT_HOST:-/var/lib/sightglass/runs}:/var/lib/sightglass/runs
      # Shared with the API: the worker is what actually calls the model, so it
      # must read the same config and keys the wizard wrote.
      - backend-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      # Ghidra and dynamic tasks write findings like any other lane, so this
      # worker needs the schema too. It was depending on redis alone.
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "core.orchestrator.health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    <<: *logging
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    environment: *backend-env
    command:
      - celery
      - -A
      - core.orchestrator.celery_app:celery_app
      - beat
      - --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      # Beat's scheduled tasks (the reaper) read the runs table.
      api:
        condition: service_healthy
    # No healthcheck: beat answers no `inspect ping`, and the slim base image
    # has no pgrep to fake one with. A wedged beat is still only visible in
    # logs; inventing a check that cannot fail would be worse than saying so.
    <<: *logging
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${SIGHTGLASS_PUBLIC_API_URL:-http://localhost:8000}
      SIGHTGLASS_API_URL: http://api:8000
      # The dashboard's own credential, attached server-side by the proxy
      # route and never sent to the browser. Setting this is optional: with
      # nothing here, opening the dashboard on a fresh stack lands on its
      # setup wizard, which mints the first admin token and persists it to
      # `web-data` below — no `.env` edit, no container restart. Set this
      # only to pin the dashboard to a token you minted yourself.
      SIGHTGLASS_TOKEN: ${SIGHTGLASS_TOKEN:-}
    volumes:
      - web-data:/app/data
    ports:
      - "${SIGHTGLASS_WEB_PORT:-3000}:3000"
    depends_on:
      # service_started only meant the process had been launched, so the
      # dashboard could come up and proxy to an API that was still migrating.
      api:
        condition: service_healthy
    <<: *logging
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  web-data:
  backend-data:
