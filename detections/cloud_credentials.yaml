# Cloud provider credentials.
#
# These are the findings that end a release. A live AWS key in a shipped
# installer is not a hygiene issue, it is an incident — so severity floors here
# are high and the patterns favour recall.

rules:
  - id: aws-access-key-id
    name: AWS access key ID
    category: cloud-credentials
    severity: critical
    confidence: 0.9
    cwe: CWE-798
    description: >
      An AWS access key ID embedded in the artifact. AKIA denotes a long-lived
      IAM user key; ASIA a temporary STS credential. Both identify an account
      and, paired with the secret key, grant API access.
    remediation: |
      1. **Rotate the key now.** The shipped build is already out; removing it
         from the next build does not un-ship it.
      2. Check CloudTrail for use of this key ID from unexpected sources.
      3. Move the credential to runtime provisioning — instance roles, IRSA, or
         a secrets manager. If the device must bootstrap, provision a scoped,
         short-lived token at first contact rather than baking a static key.
    patterns:
      - regex: '\b((?:AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16})\b'
        capture: 1
    tags: [aws, credential]
    tests:
      positive:
        - "AKIA2E0A8F3B5C7D9E1F"
        - "aws_access_key_id=ASIA5RXW3QK2LMNPQRST"
      negative:
        - "AKIA_SHORT"
        - "PACKAGE_AKIAVERSION"

  - id: aws-secret-access-key
    name: AWS secret access key
    category: cloud-credentials
    severity: critical
    confidence: 0.6
    cwe: CWE-798
    min_entropy: 4.2
    min_length: 40
    max_length: 40
    description: >
      A 40-character base64 secret paired with an access key ID. Matched by
      shape and entropy, so this rule is intentionally noisy on its own — the
      correlator raises confidence sharply when an access key ID appears nearby.
    remediation: |
      Rotate the key pair immediately, then move to runtime-provisioned
      credentials. See the remediation for `aws-access-key-id`.
    patterns:
      - regex: '(?i)aws.{0,20}?(?:secret|private).{0,20}?[=:\s"]([A-Za-z0-9/+=]{40})'
        capture: 1
      - regex: '\b([A-Za-z0-9/+]{40})\b'
        capture: 1
    tags: [aws, credential, high-noise]
    tests:
      # Not the AWS documentation example — that value is in the false-positive
      # corpus, so using it here would assert the rule is broken.
      positive:
        - 'aws_secret_access_key = "Kq2vN8xR4mT7wZ1cB5nH9jL3fD6gY0pA2sE4uI8o"'
      negative:
        - "aws_secret_access_key = REDACTED"

  - id: gcp-service-account-key
    name: GCP service account private key
    category: cloud-credentials
    severity: critical
    confidence: 0.95
    cwe: CWE-798
    description: >
      A Google Cloud service account JSON key. These are long-lived and often
      broadly scoped; embedding one in a client artifact hands every user of
      that artifact the service account's permissions.
    remediation: |
      Disable the key in IAM, then delete it. Replace with workload identity
      federation, or a short-lived token minted server-side. Audit the service
      account's role bindings while you are there — embedded keys are usually
      over-permissioned.
    patterns:
      - regex: '"type"\s*:\s*"(service_account)"'
        capture: 1
      - regex: '"private_key_id"\s*:\s*"([a-f0-9]{40})"'
        capture: 1
    tags: [gcp, credential]
    tests:
      positive:
        - '{"type": "service_account", "project_id": "example"}'
      negative:
        - '{"type": "authorized_user"}'

  - id: azure-storage-connection-string
    name: Azure storage connection string
    category: cloud-credentials
    severity: critical
    confidence: 0.95
    cwe: CWE-798
    description: >
      A full Azure Storage connection string including the account key. Grants
      read and write access to the entire storage account.
    remediation: |
      Rotate the account key in the Azure portal (rotating key1 while clients
      use key2 avoids downtime). Replace with a SAS token scoped to a single
      container and a short expiry, or with managed identity.
    patterns:
      - regex: '(AccountKey=[A-Za-z0-9/+=]{60,100})'
        capture: 1
      - regex: '(DefaultEndpointsProtocol=https?;AccountName=[a-z0-9]{3,24};AccountKey=[^;\s"]+)'
        capture: 1
    tags: [azure, credential]
    tests:
      positive:
        - "DefaultEndpointsProtocol=https;AccountName=devstore;AccountKey=Zm9vYmFyYmF6cXV1eGNvcmdlZ3JhdWx0Z2FycGx5Zm9vYmFyYmF6cXV1eGNvcmc9PQ==;"
      negative:
        - "DefaultEndpointsProtocol=https;AccountName=devstore;"

  - id: google-api-key
    name: Google API key
    category: cloud-credentials
    severity: high
    confidence: 0.85
    cwe: CWE-798
    description: >
      A Google API key. Client-side keys are expected to be visible, so the
      real question is whether this one is restricted — an unrestricted key is
      billable by anyone who finds it.
    remediation: |
      Restrict the key in the Google Cloud console by application (package name
      and signing certificate, or HTTP referrer) and by API. If it was
      unrestricted, regenerate it — it should be assumed harvested.
    patterns:
      - regex: '\b(AIza[0-9A-Za-z_\-]{35})\b'
        capture: 1
    tags: [gcp, api-key]
    tests:
      positive:
        - "AIzaSyD3vX9kLmNpQrStUvWxYz0123456789abc"
      negative:
        - "AIzaShort"
